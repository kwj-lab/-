name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile musinsa_tracker.py

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name musinsa_tracker `
            musinsa_tracker.py

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\musinsa_tracker.exe package\musinsa_tracker.exe
          Copy-Item scripts\setup_auto_update.ps1 package\setup_auto_update.ps1
          Copy-Item scripts\자동업데이트_설정.bat package\자동업데이트_설정.bat
          Copy-Item scripts\자동업데이트_즉시실행.bat package\자동업데이트_즉시실행.bat
          Copy-Item scripts\자동업데이트_해제.bat package\자동업데이트_해제.bat
          Copy-Item README.md package\README.md
          Compress-Archive -Path package\* -DestinationPath musinsa_tracker_windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: musinsa-tracker-windows
          path: musinsa_tracker_windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: musinsa_tracker_windows.zip
