name: Musinsa Adaptive Sampling v9

on:
  schedule:
    # KST 01:45,04:45,07:45,10:45,13:45,16:45,19:45,22:45
    # Each clock slot has its own cron so a delayed GitHub runner cannot change the intended adaptive slot.
    - cron: '45 16 * * *' # slot 0 = 01:45 KST
    - cron: '45 19 * * *' # slot 1 = 04:45 KST
    - cron: '45 22 * * *' # slot 2 = 07:45 KST
    - cron: '45 1 * * *'  # slot 3 = 10:45 KST
    - cron: '45 4 * * *'  # slot 4 = 13:45 KST
    - cron: '45 7 * * *'  # slot 5 = 16:45 KST
    - cron: '45 10 * * *' # slot 6 = 19:45 KST
    - cron: '45 13 * * *' # slot 7 = 22:45 KST
  workflow_dispatch:
    inputs:
      clock_slot:
        description: '수동 실행할 현재 3시간 블록 (auto 권장)'
        required: true
        type: choice
        options: ['auto','0','1','2','3','4','5','6','7']
        default: 'auto'
      dry_run:
        description: '대상 수만 계산하고 실제 조회는 하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_SHARD_WORKERS: '4'
  MUSINSA_COLLECT_BUDGET_SECONDS: '3600'
  MUSINSA_REQUEST_MIN_INTERVAL: '0.15'
  MUSINSA_REQUEST_MAX_INTERVAL: '3.0'
  # 0~2/day = 24h baseline only
  # 3~20/day = ~9h adaptive
  # 21+/day = ~3h adaptive
  MUSINSA_ADAPTIVE_MEDIUM_MIN: '3'
  MUSINSA_ADAPTIVE_HIGH_MIN: '21'
  MUSINSA_ADAPTIVE_MAX_PER_RUN: '15000'

jobs:
  adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve intended adaptive clock slot
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY2'
          import os

          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          choice = "${{ inputs.clock_slot }}" if manual else "auto"

          if manual and choice not in ("", "auto"):
              slot = int(choice)
              source = "manual"
          elif manual:
              from datetime import datetime, timezone, timedelta
              now = datetime.now(timezone(timedelta(hours=9)))
              slot = (now.hour // 3) % 8
              source = "manual-auto"
          else:
              schedule = (os.environ.get("EVENT_SCHEDULE") or "").strip()
              schedule_to_slot = {
                  "45 16 * * *": 0,
                  "45 19 * * *": 1,
                  "45 22 * * *": 2,
                  "45 1 * * *": 3,
                  "45 4 * * *": 4,
                  "45 7 * * *": 5,
                  "45 10 * * *": 6,
                  "45 13 * * *": 7,
              }
              if schedule not in schedule_to_slot:
                  raise SystemExit(f"Unknown adaptive schedule: {schedule!r}")
              slot = schedule_to_slot[schedule]
              source = f"scheduled:{schedule}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"slot={slot}\n")
          print(f"Adaptive intended clock slot: {slot} ({source})")
          PY2

      - name: Collect adaptive observations
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python musinsa_collector_v9.py collect-adaptive --clock-slot "${{ steps.slot.outputs.slot }}" $EXTRA

      - name: Wait for older Musinsa workflows before write (writer FIFO)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SELF_ID="$GITHUB_RUN_ID"
          SELF_CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELF_ID}" --jq '.created_at')"
          WORKFLOWS=(
            "collect-distributed-v9.yml"
            "recover-distributed-v9.yml"
            "adaptive-sampling-v9.yml"
            "calendar-finalize-v9.yml"
            "midnight-anchor-v9.yml"
          )

          echo "Musinsa FIFO: run=${SELF_ID}, created=${SELF_CREATED}"

          while true; do
            OLDER=""

            for WF in "${WORKFLOWS[@]}"; do
              MATCHES="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                | jq -r --arg sid "$SELF_ID" --arg sc "$SELF_CREATED" '
                    .workflow_runs[]
                    | select(
                        (.status == "queued" or
                         .status == "in_progress" or
                         .status == "waiting" or
                         .status == "pending" or
                         .status == "requested")
                        and ((.id | tostring) != $sid)
                        and (
                          (.created_at < $sc)
                          or (.created_at == $sc and .id < ($sid | tonumber))
                        )
                      )
                    | "\(.id)\t\(.status)\t\(.name)\t\(.created_at)"
                  '
              )"

              # FIFO ignores stale queued runs without jobs.
              while IFS=        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e data/observations ]; then git add -- data/observations; fi
