name: Musinsa Recovery v9

on:
  schedule:
    # Recovery runs after primary/adaptive observation windows.
    # KST 02:00,05:00,08:00,11:00,14:00,17:00,20:00,23:00
    - cron: '0 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '미수집 큐를 다시 볼 최근 일수'
        required: false
        default: '2'

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_RECOVERY_WORKERS: '2'
  # Recovery는 primary보다 훨씬 느리게 시작하고 429 시 더 느려집니다.
  MUSINSA_REQUEST_MIN_INTERVAL: '0.40'
  MUSINSA_REQUEST_MAX_INTERVAL: '5.0'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: musinsa-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate dynamic recovery budget
        id: window
        shell: bash
        run: |
          python - <<'PY'
          import math
          import os
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone(timedelta(hours=9)))
          base_hour = (now.hour // 3) * 3
          nxt = now.replace(hour=base_hour, minute=15, second=0, microsecond=0)
          if nxt <= now:
              nxt += timedelta(hours=3)

          minutes = (nxt - now).total_seconds() / 60.0

          # Never let recovery consume the final 10 minutes before the next
          # primary observation. Use at most 50 minutes even when there is more
          # room so the workflow still has time to write/commit cleanly.
          budget = max(0, min(50, math.floor(minutes - 10)))
          run = "1" if budget >= 15 else "0"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={run}\n")
              fh.write(f"budget_minutes={budget}\n")

          print(
              f"minutes_to_next_primary={minutes:.1f}, "
              f"recovery_budget_minutes={budget}, recovery_run={run}"
          )
          PY
      - name: Recover pending goods only
        if: ${{ steps.window.outputs.run == '1' }}
        shell: bash
        run: |
          DAYS="2"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.lookback_days }}" ]; then
            DAYS="${{ inputs.lookback_days }}"
          fi
          BUDGET="${{ steps.window.outputs.budget_minutes }}"
          python musinsa_collector_v9.py recover-pending \
            --lookback-days "$DAYS" \
            --max-queues 32 \
            --time-budget-minutes "$BUDGET"
      - name: Commit recovered data
        if: ${{ steps.window.outputs.run == '1' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          for p in musinsa_daily_product_sales.csv musinsa_daily_brand_sales.csv musinsa_daily_summary.csv musinsa_calendar_latest_products.csv musinsa_calendar_brand_daily.csv musinsa_calendar_summary.csv; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No recovery changes."
            exit 0
          fi
          git commit -m "chore(data): Musinsa v9 recovery [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Recovery backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-recovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/coverage/*.json
            data/recovery/**/*.csv
            musinsa_daily_product_sales.csv
