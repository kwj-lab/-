name: Musinsa Recovery v9

on:
  schedule:
    # Recovery is low priority and starts 45 minutes after adaptive sampling.
    # KST 02:30,05:30,08:30,11:30,14:30,17:30,20:30,23:30
    - cron: '30 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '미수집 큐를 다시 볼 최근 일수'
        required: false
        default: '2'

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_RECOVERY_WORKERS: '2'
  # Recovery는 primary보다 훨씬 느리게 시작하고 429 시 더 느려집니다.
  MUSINSA_REQUEST_MIN_INTERVAL: '0.40'
  MUSINSA_REQUEST_MAX_INTERVAL: '5.0'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: musinsa-data-writer
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Yield to active priority observations
        id: priority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SAFE="1"
          RUN_IDS="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${GITHUB_REF_NAME}&status=in_progress&per_page=100" \
              --jq '.workflow_runs[]
                | select(
                    .name == "Distributed Musinsa Collection v9"
                    or .name == "Musinsa Adaptive Sampling v9"
                    or .name == "Musinsa Midnight Anchor v9"
                  )
                | .id'
          )"

          for RUN_ID in $RUN_IDS; do
            ACTIVE_API_JOB="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --jq '.jobs[]
                  | select(
                      .status == "in_progress"
                      and (.name == "discover" or .name == "collect")
                    )
                  | .name' || true
            )"

            if [ -n "$ACTIVE_API_JOB" ]; then
              echo "Recovery yields to priority observation run ${RUN_ID}: ${ACTIVE_API_JOB}"
              SAFE="0"
              break
            fi
          done

          echo "safe=${SAFE}" >> "$GITHUB_OUTPUT"

      - name: Calculate dynamic recovery budget
        id: window
        shell: bash
        run: |
          python - <<'PY'
          import math
          import os
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)

          # Scheduled recovery belongs to the KST xx:00 hour where hour % 3 == 2
          # (02:00,05:00,...,23:00). If writer contention delayed it into a
          # different 3-hour phase, skip instead of colliding with a new primary.
          in_recovery_phase = (now.hour % 3 == 2)

          base_hour = (now.hour // 3) * 3
          next_primary = now.replace(
              hour=base_hour, minute=15, second=0, microsecond=0
          )
          if next_primary <= now:
              next_primary += timedelta(hours=3)

          critical_times = [next_primary]

          # 23:55 midnight anchor is higher priority than recovery. Protect a
          # 10-minute lead-in before it just like the regular primary window.
          anchor = now.replace(hour=23, minute=55, second=0, microsecond=0)
          if anchor <= now:
              anchor += timedelta(days=1)
          critical_times.append(anchor)

          next_critical = min(critical_times)
          minutes = (next_critical - now).total_seconds() / 60.0

          budget = max(0, min(50, math.floor(minutes - 10)))
          run = "1" if in_recovery_phase and budget >= 15 else "0"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={run}\n")
              fh.write(f"budget_minutes={budget}\n")

          print(
              f"in_recovery_phase={in_recovery_phase}, "
              f"minutes_to_next_critical={minutes:.1f}, "
              f"recovery_budget_minutes={budget}, recovery_run={run}"
          )
          PY
      - name: Recover pending goods only
        if: ${{ steps.window.outputs.run == '1' && steps.priority.outputs.safe == '1' }}
        shell: bash
        run: |
          DAYS="2"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.lookback_days }}" ]; then
            DAYS="${{ inputs.lookback_days }}"
          fi
          BUDGET="${{ steps.window.outputs.budget_minutes }}"
          python musinsa_collector_v9.py recover-pending \
            --lookback-days "$DAYS" \
            --max-queues 32 \
            --time-budget-minutes "$BUDGET"
      - name: Commit recovered data
        if: ${{ steps.window.outputs.run == '1' && steps.priority.outputs.safe == '1' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          for p in musinsa_daily_product_sales.csv musinsa_daily_brand_sales.csv musinsa_daily_summary.csv musinsa_calendar_latest_products.csv musinsa_calendar_brand_daily.csv musinsa_calendar_summary.csv; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No recovery changes."
            exit 0
          fi
          git commit -m "chore(data): Musinsa v9 recovery [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Recovery backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-recovery-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/coverage/*.json
            data/recovery/**/*.csv
            musinsa_daily_product_sales.csv
