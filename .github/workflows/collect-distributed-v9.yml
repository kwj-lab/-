name: Distributed Musinsa Collection v9

on:
  schedule:
    # Each KST slot has its own cron so FIFO delays cannot change the intended slot.
    # slot 0 = 00:15 KST = 15:15 UTC (previous UTC day)
    - cron: '15 15 * * *'
    # slot 1 = 03:15 KST = 18:15 UTC
    - cron: '15 18 * * *'
    # slot 2 = 06:15 KST = 21:15 UTC
    - cron: '15 21 * * *'
    # slot 3 = 09:15 KST = 00:15 UTC
    - cron: '15 0 * * *'
    # slot 4 = 12:15 KST = 03:15 UTC
    - cron: '15 3 * * *'
    # slot 5 = 15:15 KST = 06:15 UTC
    - cron: '15 6 * * *'
    # slot 6 = 18:15 KST = 09:15 UTC
    - cron: '15 9 * * *'
    # slot 7 = 21:15 KST = 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행할 slot'
        required: true
        type: choice
        options: ['0','1','2','3','4','5','6','7']
        default: '0'
      full_discovery:
        description: '이 slot 담당 브랜드 전체 상품 강제 재탐색'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_DISCOVERY_WORKERS: '2'
  # 하나의 process 안에서 8 worker를 두고 adaptive gate가 8->4->2->1로 직접 조절합니다.
  MUSINSA_SHARD_WORKERS: '8'
  MUSINSA_INLINE_RETRY_MAX: '300'
  MUSINSA_COLLECT_BUDGET_SECONDS: '4800'
  MUSINSA_REQUEST_MIN_INTERVAL: '0.10'
  MUSINSA_REQUEST_MAX_INTERVAL: '3.0'
  MUSINSA_MAX_SEARCH_PAGES: '300'
  MUSINSA_QUICK_SEARCH_MAX_PAGES: '40'
  MUSINSA_QUICK_KNOWN_STOP_PAGES: '3'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      collector_sha: ${{ steps.revision.outputs.sha }}
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record collector revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve intended collection slot
        id: slot
        shell: bash
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY2'
          import os

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              slot = int("${{ inputs.slot }}")
              source = "manual"
          elif os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              schedule = (os.environ.get("EVENT_SCHEDULE") or "").strip()
              schedule_to_slot = {
                  "15 15 * * *": 0,
                  "15 18 * * *": 1,
                  "15 21 * * *": 2,
                  "15 0 * * *": 3,
                  "15 3 * * *": 4,
                  "15 6 * * *": 5,
                  "15 9 * * *": 6,
                  "15 12 * * *": 7,
              }
              if schedule not in schedule_to_slot:
                  raise SystemExit(f"Unknown scheduled cron: {schedule!r}")
              slot = schedule_to_slot[schedule]
              source = f"scheduled:{schedule}"
          else:
              raise SystemExit(f"Unsupported event for collection: {os.environ.get('GITHUB_EVENT_NAME')!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"slot={slot}\n")
          print(f"Intended slot: {slot} ({source})")
          PY2

      - name: Resolve intended KST snapshot date
        id: snapshot
        shell: bash
        run: |
          python - <<'PY2'
          import os
          from datetime import datetime, timedelta, timezone

          KST = timezone(timedelta(hours=9))
          now = datetime.now(KST)

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              intended = now
          else:
              slot = int("${{ steps.slot.outputs.slot }}")
              scheduled_hour = slot * 3
              intended = now.replace(
                  hour=scheduled_hour,
                  minute=15,
                  second=0,
                  microsecond=0,
              )
              if intended > now:
                  intended -= timedelta(days=1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"snapshot_date={intended.date().isoformat()}\n")
          print("Intended KST snapshot date:", intended.date().isoformat())
          PY2
      - name: Discover and refresh prices
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_discovery }}" = "true" ]; then EXTRA="--full-discovery"; fi
          python musinsa_collector_v9.py discover-slot \
            --state-dir run_state \
            --slot "${{ steps.slot.outputs.slot }}" \
            --snapshot-date "${{ steps.snapshot.outputs.snapshot_date }}" \
            $EXTRA
          if [ -d data/lifecycle ]; then cp -R data/lifecycle run_state/lifecycle; fi
      - uses: actions/upload-artifact@v4
        with:
          name: v9-discovery-state
          retention-days: 1
          path: |
            run_state/musinsa_watchlist.txt
            run_state/musinsa_catalog.csv
            run_state/musinsa_brand_audit.csv
            run_state/lifecycle/
            run_state/new_products_delta.csv
            run_state/discovery_stats.json
            run_state/snapshot_date.txt
            run_state/slot.txt

  collect:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.collector_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v9-discovery-state
          path: run_state
      - name: Collect entire slot with global adaptive concurrency
        shell: bash
        run: |
          mkdir -p shard_output
          python musinsa_collector_v9.py collect-slot-shard \
            --state-dir run_state \
            --slot ${{ needs.discover.outputs.slot }} \
            --shard-index 0 \
            --shard-count 1 \
            --output shard_output/slot-primary.csv
      - name: Upload partial/full primary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-slot-${{ needs.discover.outputs.slot }}-primary
          retention-days: 1
          if-no-files-found: ignore
          path: shard_output/slot-primary.csv

  aggregate:
    if: ${{ always() && needs.discover.result == 'success' }}
    needs: [discover, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: musinsa-data-writer
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v9-discovery-state
          path: run_state
      - run: mkdir -p shard_results
      - name: Download available primary result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: v9-slot-${{ needs.discover.outputs.slot }}-primary
          path: shard_results
      - name: Aggregate and create recovery queue
        run: |
          python musinsa_collector_v9.py aggregate-slot --state-dir run_state --shard-dir shard_results

      - name: Recalculate recent calendar-day estimates immediately
        shell: bash
        run: |
          python musinsa_collector_v9.py finalize-calendar --lookback-days 3

      - name: Commit primary data and coverage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          for p in             musinsa_watchlist.txt             musinsa_catalog.csv             musinsa_brand_audit.csv             musinsa_daily_product_sales.csv             musinsa_daily_brand_sales.csv             musinsa_daily_summary.csv             musinsa_new_products.csv             musinsa_calendar_latest_products.csv             musinsa_calendar_brand_daily.csv             musinsa_calendar_summary.csv             data/calendar; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then echo "No collected changes."; exit 0; fi
          git commit -m "chore(data): Musinsa v9 slot ${{ needs.discover.outputs.slot }} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-backup-slot-${{ needs.discover.outputs.slot }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            musinsa_daily_product_sales.csv
            musinsa_daily_brand_sales.csv
            musinsa_daily_summary.csv
            data/coverage/*.json
            data/recovery/**/*.csv
            data/latest_slots/*.csv.gz
