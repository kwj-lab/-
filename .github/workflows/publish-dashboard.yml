name: Publish live Musinsa dashboard

on:
  workflow_run:
    workflows:
      - Distributed Musinsa Collection v9
      - Musinsa Adaptive Sampling v9
      - Musinsa Midnight Anchor v9
      - Musinsa Recovery v9
      - Musinsa Calendar Daily Finalizer v9
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'musinsa_dashboard.py'
      - 'musinsa_collector_v9.py'
      - '.github/workflows/publish-dashboard.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musinsa-dashboard-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github
            tests
            data/slots
            data/observations
            data/lifecycle
            data/dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify daily attribution
        run: python -m unittest discover -s tests -p 'test_live_dashboard.py' -v
      - name: Build daily estimates through the latest observation
        run: python musinsa_dashboard.py
      - name: Publish complete dashboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/dashboard
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): publish current daily estimates [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
