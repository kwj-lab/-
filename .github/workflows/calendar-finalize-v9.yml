name: Musinsa Calendar Daily Finalizer v9

on:
  schedule:
    # 14:30 UTC = KST 23:30
    # 오늘 날짜를 억지로 확정하지 않고, 어제까지의 KST 00:00~24:00 추정치를 만듭니다.
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '최근 며칠을 다시 계산할지 (복구 데이터 backfill 포함)'
        required: false
        default: '3'
      date:
        description: '특정 날짜 YYYY-MM-DD만 다시 계산 (비우면 lookback 사용)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for older Musinsa workflows (FIFO)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SELF_ID="$GITHUB_RUN_ID"
          SELF_CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELF_ID}" --jq '.created_at')"
          WORKFLOWS=(
            "collect-distributed-v9.yml"
            "recover-distributed-v9.yml"
            "adaptive-sampling-v9.yml"
            "calendar-finalize-v9.yml"
            "midnight-anchor-v9.yml"
          )

          echo "Musinsa FIFO: run=${SELF_ID}, created=${SELF_CREATED}"

          while true; do
            OLDER=""

            for WF in "${WORKFLOWS[@]}"; do
              MATCHES="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                | jq -r --arg sid "$SELF_ID" --arg sc "$SELF_CREATED" '
                    .workflow_runs[]
                    | select(
                        (.status == "queued" or
                         .status == "in_progress" or
                         .status == "waiting" or
                         .status == "pending" or
                         .status == "requested")
                        and ((.id | tostring) != $sid)
                        and (
                          (.created_at < $sc)
                          or (.created_at == $sc and .id < ($sid | tonumber))
                        )
                      )
                    | "\(.id)\t\(.status)\t\(.name)\t\(.created_at)"
                  '
              )"

              if [ -n "$MATCHES" ]; then
                OLDER="${OLDER}${MATCHES}"$'\n'
              fi
            done

            if [ -z "${OLDER//$'\n'/}" ]; then
              echo "Musinsa FIFO turn acquired."
              break
            fi

            echo "Older Musinsa runs are active; waiting 20 seconds:"
            printf '%s' "$OLDER"
            sleep 20
          done

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build KST calendar-day estimates
        shell: bash
        run: |
          DAYS="3"
          TARGET=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.lookback_days }}" ]; then DAYS="${{ inputs.lookback_days }}"; fi
            if [ -n "${{ inputs.date }}" ]; then TARGET="${{ inputs.date }}"; fi
          fi

          if [ -n "$TARGET" ]; then
            python musinsa_collector_v9.py finalize-calendar --date "$TARGET"
          else
            python musinsa_collector_v9.py finalize-calendar --lookback-days "$DAYS"
          fi

      - name: Commit calendar analytics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in \
            musinsa_calendar_latest_products.csv \
            musinsa_calendar_brand_daily.csv \
            musinsa_calendar_summary.csv \
            data/calendar; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No calendar analytics changes."
            exit 0
          fi

          git commit -m "chore(data): KST calendar daily estimates v9 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Calendar analytics backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-calendar-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            musinsa_calendar_latest_products.csv
            musinsa_calendar_brand_daily.csv
            musinsa_calendar_summary.csv
            data/calendar/calendar_manifest.json
