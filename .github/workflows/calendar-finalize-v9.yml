name: Musinsa Calendar Daily Finalizer v9

on:
  schedule:
    # 15:30 UTC = KST 00:30
    # 23:55 midnight anchor와 00:15 primary 관측을 먼저 확보한 뒤, 방금 끝난 KST 날짜까지 마감 계산합니다.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '최근 며칠을 다시 계산할지 (복구 데이터 backfill 포함)'
        required: false
        default: '3'
      date:
        description: '특정 날짜 YYYY-MM-DD만 다시 계산 (비우면 lookback 사용)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: musinsa-data-writer
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build KST calendar-day estimates
        shell: bash
        run: |
          DAYS="3"
          TARGET=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.lookback_days }}" ]; then DAYS="${{ inputs.lookback_days }}"; fi
            if [ -n "${{ inputs.date }}" ]; then TARGET="${{ inputs.date }}"; fi
          fi

          if [ -n "$TARGET" ]; then
            python musinsa_collector_v9.py finalize-calendar --date "$TARGET"
          else
            python musinsa_collector_v9.py finalize-calendar --lookback-days "$DAYS"
          fi

      - name: Commit calendar analytics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in \
            musinsa_daily_product_sales.csv \
            musinsa_daily_brand_sales.csv \
            musinsa_daily_summary.csv \
            data/latest_slots \
            data/sales_policy.json \
            musinsa_calendar_latest_products.csv \
            musinsa_calendar_brand_daily.csv \
            musinsa_calendar_summary.csv \
            data/calendar; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No calendar analytics changes."
            exit 0
          fi

          git commit -m "chore(data): KST calendar daily estimates v9 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Calendar analytics backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-calendar-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            musinsa_calendar_latest_products.csv
            musinsa_calendar_brand_daily.csv
            musinsa_calendar_summary.csv
            data/calendar/calendar_manifest.json
