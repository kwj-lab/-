name: Musinsa Calendar Daily Finalizer v9

on:
  schedule:
    # 15:30 UTC = KST 00:30
    # 23:55 midnight anchor와 00:15 primary 관측을 먼저 확보한 뒤, 방금 끝난 KST 날짜까지 마감 계산합니다.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '최근 며칠을 다시 계산할지 (복구 데이터 backfill 포함)'
        required: false
        default: '3'
      date:
        description: '특정 날짜 YYYY-MM-DD만 다시 계산 (비우면 lookback 사용)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for older Musinsa workflows (FIFO)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SELF_ID="$GITHUB_RUN_ID"
          SELF_CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELF_ID}" --jq '.created_at')"
          WORKFLOWS=(
            "collect-distributed-v9.yml"
            "recover-distributed-v9.yml"
            "adaptive-sampling-v9.yml"
            "calendar-finalize-v9.yml"
            "midnight-anchor-v9.yml"
          )

          echo "Musinsa FIFO: run=${SELF_ID}, created=${SELF_CREATED}"

          while true; do
            OLDER=""

            for WF in "${WORKFLOWS[@]}"; do
              MATCHES="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                | jq -r --arg sid "$SELF_ID" --arg sc "$SELF_CREATED" '
                    .workflow_runs[]
                    | select(
                        (.status == "queued" or
                         .status == "in_progress" or
                         .status == "waiting" or
                         .status == "pending" or
                         .status == "requested")
                        and ((.id | tostring) != $sid)
                        and (
                          (.created_at < $sc)
                          or (.created_at == $sc and .id < ($sid | tonumber))
                        )
                      )
                    | "\(.id)\t\(.status)\t\(.name)\t\(.created_at)"
                  '
              )"

              # FIFO ignores stale queued runs without jobs.
              while IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_NAME RUN_CREATED; do
                if [ -z "$RUN_ID" ]; then continue; fi
                if [ "$RUN_STATUS" = "queued" ]; then
                  AGE=$(( $(date +%s) - $(date -d "$RUN_CREATED" +%s) ))
                  if [ "$AGE" -ge 5400 ]; then
                    JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=1" --jq '.total_count')"
                    if [ "$JOBS" = "0" ]; then
                      echo "Ignoring abandoned queued run ${RUN_ID}: no jobs after ${AGE}s"
                      continue
                    fi
                  fi
                fi
                OLDER="${OLDER}${RUN_ID}"$'\t'"${RUN_STATUS}"$'\t'"${RUN_NAME}"$'\t'"${RUN_CREATED}"$'\n'
              done <<< "$MATCHES"
            done

            if [ -z "${OLDER//$'\n'/}" ]; then
              echo "Musinsa FIFO turn acquired."
              break
            fi

            echo "Older Musinsa runs are active; waiting 20 seconds:"
            printf '%s' "$OLDER"
            sleep 20
          done

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build KST calendar-day estimates
        shell: bash
        run: |
          DAYS="3"
          TARGET=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.lookback_days }}" ]; then DAYS="${{ inputs.lookback_days }}"; fi
            if [ -n "${{ inputs.date }}" ]; then TARGET="${{ inputs.date }}"; fi
          fi

          if [ -n "$TARGET" ]; then
            python musinsa_collector_v9.py finalize-calendar --date "$TARGET"
          else
            python musinsa_collector_v9.py finalize-calendar --lookback-days "$DAYS"
          fi

      - name: Commit calendar analytics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in \
            musinsa_daily_product_sales.csv \
            musinsa_daily_brand_sales.csv \
            musinsa_daily_summary.csv \
            data/latest_slots \
            data/sales_policy.json \
            musinsa_calendar_latest_products.csv \
            musinsa_calendar_brand_daily.csv \
            musinsa_calendar_summary.csv \
            data/calendar; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No calendar analytics changes."
            exit 0
          fi

          git commit -m "chore(data): KST calendar daily estimates v9 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Calendar analytics backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-calendar-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            musinsa_calendar_latest_products.csv
            musinsa_calendar_brand_daily.csv
            musinsa_calendar_summary.csv
            data/calendar/calendar_manifest.json
