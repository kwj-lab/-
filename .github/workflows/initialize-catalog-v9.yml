name: Initialize Full Musinsa Catalog v9

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musinsa-v9-catalog-init
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  MUSINSA_DISCOVERY_WORKERS: '2'
  MUSINSA_MAX_SEARCH_PAGES: '300'
  MUSINSA_QUICK_SEARCH_MAX_PAGES: '40'
  MUSINSA_QUICK_KNOWN_STOP_PAGES: '3'

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover all 8 brand slots
        shell: bash
        run: |
          set -e

          for SLOT in 0 1 2 3 4 5 6 7; do
            echo "=============================================="
            echo "Initializing catalog slot $SLOT / 7"
            echo "=============================================="

            rm -rf run_state

            python musinsa_collector_v9.py discover-slot \
              --state-dir run_state \
              --slot "$SLOT" \
              --full-discovery

            # 다음 slot이 지금까지 발견된 catalog를 이어서 읽도록 즉시 root에 반영
            cp run_state/musinsa_watchlist.txt musinsa_watchlist.txt
            cp run_state/musinsa_catalog.csv musinsa_catalog.csv

            python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("musinsa_catalog.csv")
          if p.exists():
              with p.open("r",encoding="utf-8-sig",newline="") as f:
                  print("Current catalog products:", sum(1 for _ in csv.DictReader(f)))
          PY
          done

      - name: Commit initialized catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- musinsa_catalog.csv musinsa_watchlist.txt

          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi

          git commit -m "chore(data): initialize full Musinsa catalog v9 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload catalog backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musinsa-v9-full-catalog-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            musinsa_catalog.csv
            musinsa_watchlist.txt
