name: Diagnose Musinsa Product

on:
  workflow_dispatch:
    inputs:
      goods_no:
        description: '무신사 상품번호'
        required: true
        default: '4551885'
      lookback_days:
        description: '최근 며칠 원본을 볼지'
        required: false
        default: '14'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose purchaseTotal timeline
        shell: bash
        env:
          GOODS_NO: ${{ inputs.goods_no }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import csv, gzip, os, re

          ROOT = Path(".")
          GOODS = str(os.environ["GOODS_NO"]).strip()
          DAYS = max(1, int(os.environ.get("LOOKBACK_DAYS", "14")))
          KST = ZoneInfo("Asia/Seoul")
          cutoff = datetime.now(KST) - timedelta(days=DAYS)

          def read_csv(path):
              try:
                  if path.suffix == ".gz":
                      with gzip.open(path, "rt", encoding="utf-8-sig", newline="") as f:
                          return list(csv.DictReader(f))
                  with path.open("r", encoding="utf-8-sig", newline="") as f:
                      return list(csv.DictReader(f))
              except Exception:
                  return []

          def parse_dt(v):
              if not v:
                  return None
              try:
                  d = datetime.fromisoformat(str(v).replace("Z","+00:00"))
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=KST)
                  return d.astimezone(KST)
              except Exception:
                  return None

          rows = []

          # Primary, adaptive, anchor observations
          candidates = []
          for root in [
              ROOT/"data"/"slots",
              ROOT/"data"/"observations",
              ROOT/"data"/"daily",
              ROOT/"data"/"latest_slots",
          ]:
              if root.exists():
                  candidates.extend(root.rglob("*.csv"))
                  candidates.extend(root.rglob("*.csv.gz"))

          seen = set()
          for path in candidates:
              for r in read_csv(path):
                  if str(r.get("goods_no") or "").strip() != GOODS:
                      continue
                  dt = parse_dt(r.get("checked_at"))
                  if dt and dt < cutoff:
                      continue
                  key = (
                      str(r.get("checked_at") or ""),
                      str(r.get("purchase_total") or ""),
                      str(path),
                  )
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({
                      "dt": dt,
                      "checked_at": r.get("checked_at") or "",
                      "purchase_total": r.get("purchase_total") or "",
                      "price": r.get("current_price") or r.get("display_price") or "",
                      "kind": r.get("sample_kind") or ("primary" if "slots" in str(path) else ""),
                      "file": str(path),
                  })

          rows.sort(key=lambda x: (x["dt"] or datetime.min.replace(tzinfo=KST), x["file"]))

          # Deduplicate same timestamp/value across copied snapshot files.
          compact=[]
          keys=set()
          for r in rows:
              k=(r["checked_at"], r["purchase_total"])
              if k in keys:
                  continue
              keys.add(k)
              compact.append(r)
          rows=compact

          print("="*100)
          print(f"PRODUCT DIAGNOSIS goodsNo={GOODS} lookback={DAYS}d")
          print("="*100)

          if not rows:
              print("NO RAW OBSERVATIONS FOUND")
          else:
              print(f"{'checked_at':27s} {'purchaseTotal':>14s} {'delta':>10s} {'price':>12s} {'kind':>16s}")
              print("-"*100)
              prev=None
              anomaly=False
              for r in rows:
                  try: cur=int(float(str(r["purchase_total"]).replace(",","")))
                  except: cur=None
                  delta=None if prev is None or cur is None else cur-prev
                  flag=""
                  if delta is not None and delta < 0:
                      flag="  <<< DROP"
                      anomaly=True
                  elif delta is not None and prev is not None and prev <= 10 and cur is not None and cur >= 100:
                      flag="  <<< POSSIBLE RECOVERY SPIKE"
                      anomaly=True
                  print(
                      f"{r['checked_at'][:27]:27s} "
                      f"{str(r['purchase_total']):>14s} "
                      f"{('' if delta is None else str(delta)):>10s} "
                      f"{str(r['price']):>12s} "
                      f"{str(r['kind']):>16s}{flag}"
                  )
                  if cur is not None:
                      prev=cur

              print("-"*100)
              print("raw observations:", len(rows))
              print("anomaly pattern found:", anomaly)

          # Dashboard/calculated values
          print("\n=== CURRENT CALCULATED ROWS ===")
          for fname in [
              "musinsa_calendar_latest_products.csv",
              "musinsa_daily_product_sales.csv",
          ]:
              p=ROOT/fname
              found=[r for r in read_csv(p) if str(r.get("goods_no") or "").strip()==GOODS]
              print(f"\n[{fname}]")
              if not found:
                  print("not found")
                  continue
              for r in found[-5:]:
                  keys=[
                      "date","brand_name","product_name",
                      "purchase_total","daily_sales","estimated_sales",
                      "daily_estimated_gmv","estimated_gmv",
                      "coverage_pct","confidence","observation_count","max_interval_hours"
                  ]
                  print(" | ".join(f"{k}={r.get(k,'')}" for k in keys if k in r))

          print("\n=== INTERPRETATION ===")
          print("- DROP followed by large recovery = likely counter/API anomaly, not real sales.")
          print("- Smooth monotonic increases across multiple observations = likely genuine purchaseTotal growth.")
          print("- A single huge positive jump with no preceding drop still needs comparison with adjacent observations.")
          PY
