name: Validate Musinsa collector

on:
  push:
    paths:
      - 'musinsa_collector_v9.py'
      - '.github/workflows/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'musinsa_collector_v9.py'
      - '.github/workflows/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            tests
            musinsa_collector_v9.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
