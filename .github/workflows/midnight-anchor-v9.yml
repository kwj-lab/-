name: Musinsa Midnight Anchor v9

on:
  schedule:
    # 23:55 KST = 14:55 UTC.
    # High-selling products get a dedicated observation before the KST day boundary.
    - cron: '55 14 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: '최대 수집 상품수 (0 = 환경변수 기본값)'
        required: false
        default: '0'
      dry_run:
        description: '대상만 계산하고 실제 조회하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_SHARD_WORKERS: '4'
  MUSINSA_COLLECT_BUDGET_SECONDS: '3600'
  MUSINSA_REQUEST_MIN_INTERVAL: '0.15'
  MUSINSA_REQUEST_MAX_INTERVAL: '3.0'
  MUSINSA_MIDNIGHT_ANCHOR_MIN: '3'
  MUSINSA_MIDNIGHT_ANCHOR_MAX_PER_RUN: '15000'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Check KST midnight-anchor window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # The trigger itself represents the intended 23:55 observation.
            # Do not discard it only because GitHub started the runner a little late.
            RUN_ANCHOR="1"
          else
            RUN_ANCHOR="$(python -c 'from datetime import datetime,timedelta,timezone; now=datetime.now(timezone(timedelta(hours=9))); mins=now.hour*60+now.minute; print("1" if mins>=1435 or mins<=15 else "0")')"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            RUN_ANCHOR="1"
          fi

          echo "run=${RUN_ANCHOR}" >> "$GITHUB_OUTPUT"
          if [ "$RUN_ANCHOR" = "1" ]; then
            echo "Midnight anchor observation enabled."
          else
            echo "Outside 23:55~00:15 KST; manual live anchor skipped."
          fi

      - name: Checkout repository
        if: ${{ steps.window.outputs.run == '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        if: ${{ steps.window.outputs.run == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect midnight anchor observations
        if: ${{ steps.window.outputs.run == '1' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          MAX="${{ inputs.max_products }}"
          if [ -n "$MAX" ] && [ "$MAX" != "0" ]; then
            EXTRA="$EXTRA --max-products $MAX"
          fi
          python musinsa_collector_v9.py collect-midnight-anchor $EXTRA

      - name: Package midnight-anchor payload
        if: ${{ steps.window.outputs.run == '1' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          git ls-files -m -o --exclude-standard -- data/observations data/anchor > anchor-files.txt
          if [ -s anchor-files.txt ]; then
            tar -czf anchor-payload.tgz -T anchor-files.txt
          fi

      - name: Upload midnight-anchor payload
        if: ${{ steps.window.outputs.run == '1' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: v9-anchor-payload-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: anchor-payload.tgz

      - name: Upload anchor report
        if: ${{ always() && steps.window.outputs.run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: v9-midnight-anchor-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: data/anchor/**/*.json

  commit:
    needs: collect
    if: ${{ needs.collect.result == 'success' && needs.collect.outputs.run == '1' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: musinsa-data-writer
      cancel-in-progress: false
    steps:
      - name: Checkout latest repository state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download midnight-anchor payload
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: v9-anchor-payload-${{ github.run_id }}
          path: payload

      - name: Restore midnight-anchor payload
        shell: bash
        run: |
          if [ -f payload/anchor-payload.tgz ]; then
            tar -xzf payload/anchor-payload.tgz
          fi

      - name: Commit midnight anchor observations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e data/observations ]; then git add -- data/observations; fi
          if [ -e data/anchor ]; then git add -- data/anchor; fi
          if git diff --cached --quiet; then
            echo "No midnight-anchor changes."
            exit 0
          fi
          git commit -m "chore(data): midnight Musinsa anchor [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
