name: Musinsa Midnight Anchor v9

on:
  schedule:
    # 23:55 KST = 14:55 UTC.
    # 고판매 상품을 자정 직전에 우선 관측하고 00:15 primary 수집 전에 끝내는 전용 경계 슬롯입니다.
    # GitHub schedule is the canonical boundary trigger; external watchdog runs outside the boundary window are ignored below.
    - cron: '55 14 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: '최대 수집 상품수 (0 = 환경변수 기본값)'
        required: false
        default: '0'
      dry_run:
        description: '대상만 계산하고 실제 조회하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_SHARD_WORKERS: '4'
  MUSINSA_COLLECT_BUDGET_SECONDS: '3600'
  MUSINSA_REQUEST_MIN_INTERVAL: '0.15'
  MUSINSA_REQUEST_MAX_INTERVAL: '3.0'
  MUSINSA_MIDNIGHT_ANCHOR_MIN: '3'
  MUSINSA_MIDNIGHT_ANCHOR_MAX_PER_RUN: '15000'

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check KST midnight-anchor window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          RUN_ANCHOR="$(python -c 'from datetime import datetime,timedelta,timezone; now=datetime.now(timezone(timedelta(hours=9))); mins=now.hour*60+now.minute; print("1" if mins>=1435 or mins<=15 else "0")')"

          # Manual dry-run is allowed outside the live boundary window because it does not query products.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            RUN_ANCHOR="1"
          fi

          echo "run=${RUN_ANCHOR}" >> "$GITHUB_OUTPUT"
          if [ "$RUN_ANCHOR" = "1" ]; then
            echo "Midnight anchor is allowed now (23:55~00:15 KST)."
          else
            echo "Outside 23:55~00:15 KST; skipping this late/early midnight-anchor trigger."
          fi

      - name: Checkout repository
        if: ${{ steps.window.outputs.run == '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        if: ${{ steps.window.outputs.run == '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect midnight anchor observations
        if: ${{ steps.window.outputs.run == '1' }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          MAX="${{ inputs.max_products }}"
          if [ -n "$MAX" ] && [ "$MAX" != "0" ]; then
            EXTRA="$EXTRA --max-products $MAX"
          fi
          python musinsa_collector_v9.py collect-midnight-anchor $EXTRA

      - name: Wait for older Musinsa workflows before write (writer FIFO)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SELF_ID="$GITHUB_RUN_ID"
          SELF_CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELF_ID}" --jq '.created_at')"
          WORKFLOWS=(
            "collect-distributed-v9.yml"
            "recover-distributed-v9.yml"
            "adaptive-sampling-v9.yml"
            "calendar-finalize-v9.yml"
            "midnight-anchor-v9.yml"
          )

          echo "Musinsa FIFO: run=${SELF_ID}, created=${SELF_CREATED}"

          while true; do
            OLDER=""

            for WF in "${WORKFLOWS[@]}"; do
              MATCHES="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                | jq -r --arg sid "$SELF_ID" --arg sc "$SELF_CREATED" '
                    .workflow_runs[]
                    | select(
                        (.status == "queued" or
                         .status == "in_progress" or
                         .status == "waiting" or
                         .status == "pending" or
                         .status == "requested")
                        and ((.id | tostring) != $sid)
                        and (
                          (.created_at < $sc)
                          or (.created_at == $sc and .id < ($sid | tonumber))
                        )
                      )
                    | "\(.id)\t\(.status)\t\(.name)\t\(.created_at)"
                  '
              )"

              # FIFO ignores stale queued runs without jobs.
              while IFS=      - name: Commit midnight anchor observations
        if: ${{ steps.window.outputs.run == '1' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in \
            data/observations \
            data/anchor; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No midnight-anchor changes."
            exit 0
          fi

          git commit -m "chore(data): midnight Musinsa anchor [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload anchor report
        if: ${{ always() && steps.window.outputs.run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: v9-midnight-anchor-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: data/anchor/**/*.json
