name: Musinsa Midnight Anchor v9

on:
  schedule:
    # 23:50 KST = 14:50 UTC.
    # 00:15 primary 수집보다 먼저 경계 관측을 확보해 날짜 귀속 오차를 줄입니다.
    # GitHub schedule is only fallback; Cloudflare watchdog is primary.
    - cron: '50 14 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: '최대 수집 상품수 (0 = 환경변수 기본값)'
        required: false
        default: '0'
      dry_run:
        description: '대상만 계산하고 실제 조회하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

env:
  PYTHONUTF8: '1'
  MUSINSA_SHARD_WORKERS: '4'
  MUSINSA_COLLECT_BUDGET_SECONDS: '3600'
  MUSINSA_REQUEST_MIN_INTERVAL: '0.15'
  MUSINSA_REQUEST_MAX_INTERVAL: '3.0'
  MUSINSA_MIDNIGHT_ANCHOR_MIN: '3'
  MUSINSA_MIDNIGHT_ANCHOR_MAX_PER_RUN: '15000'

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Give older Musinsa jobs a short grace period
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SELF_ID="$GITHUB_RUN_ID"
          SELF_CREATED="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SELF_ID}" --jq '.created_at')"
          WORKFLOWS=(
            "collect-distributed-v9.yml"
            "recover-distributed-v9.yml"
            "adaptive-sampling-v9.yml"
            "calendar-finalize-v9.yml"
            "midnight-anchor-v9.yml"
          )

          # 자정 앵커는 날짜 경계와의 거리가 정확도에 직접 영향을 줍니다.
          # 기존 작업이 곧 끝나면 잠깐 양보하되, 최대 10분을 넘겨 기다리지는 않습니다.
          DEADLINE=$(( $(date +%s) + 600 ))
          echo "Midnight-anchor priority wait: at most 10 minutes."

          while true; do
            OLDER=""

            for WF in "${WORKFLOWS[@]}"; do
              MATCHES="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
                | jq -r --arg sid "$SELF_ID" --arg sc "$SELF_CREATED" '
                    .workflow_runs[]
                    | select(
                        (.status == "queued" or
                         .status == "in_progress" or
                         .status == "waiting" or
                         .status == "pending" or
                         .status == "requested")
                        and ((.id | tostring) != $sid)
                        and (
                          (.created_at < $sc)
                          or (.created_at == $sc and .id < ($sid | tonumber))
                        )
                      )
                    | "\(.id)\t\(.status)\t\(.name)\t\(.created_at)"
                  '
              )"

              while IFS=$'\t' read -r RUN_ID RUN_STATUS RUN_NAME RUN_CREATED; do
                if [ -z "$RUN_ID" ]; then continue; fi
                if [ "$RUN_STATUS" = "queued" ]; then
                  AGE=$(( $(date +%s) - $(date -d "$RUN_CREATED" +%s) ))
                  if [ "$AGE" -ge 5400 ]; then
                    JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=1" --jq '.total_count')"
                    if [ "$JOBS" = "0" ]; then
                      echo "Ignoring abandoned queued run ${RUN_ID}: no jobs after ${AGE}s"
                      continue
                    fi
                  fi
                fi
                OLDER="${OLDER}${RUN_ID}"$'\t'"${RUN_STATUS}"$'\t'"${RUN_NAME}"$'\t'"${RUN_CREATED}"$'\n'
              done <<< "$MATCHES"
            done

            if [ -z "${OLDER//$'\n'/}" ]; then
              echo "No older Musinsa writer is active; anchor starts now."
              break
            fi

            NOW=$(date +%s)
            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "10-minute grace period expired. Starting midnight anchor now to protect day-boundary accuracy."
              printf '%s' "$OLDER"
              break
            fi

            echo "Older Musinsa runs are active; waiting 20 seconds (anchor will not wait past 10 minutes):"
            printf '%s' "$OLDER"
            sleep 20
          done

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect midnight anchor observations
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="$EXTRA --dry-run"
          fi
          MAX="${{ inputs.max_products }}"
          if [ -n "$MAX" ] && [ "$MAX" != "0" ]; then
            EXTRA="$EXTRA --max-products $MAX"
          fi
          python musinsa_collector_v9.py collect-midnight-anchor $EXTRA

      - name: Recalculate calendar estimates immediately
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          python musinsa_collector_v9.py finalize-calendar --lookback-days 2

      - name: Commit anchor observations and refreshed calendar
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in \
            musinsa_daily_product_sales.csv \
            musinsa_daily_brand_sales.csv \
            musinsa_daily_summary.csv \
            data/latest_slots \
            data/sales_policy.json \
            data/observations \
            data/anchor \
            data/calendar \
            musinsa_calendar_latest_products.csv \
            musinsa_calendar_brand_daily.csv \
            musinsa_calendar_summary.csv; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "No midnight-anchor changes."
            exit 0
          fi

          git commit -m "chore(data): midnight Musinsa anchor [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload anchor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-midnight-anchor-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: data/anchor/**/*.json
